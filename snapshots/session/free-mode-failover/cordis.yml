# Free-mode overlay: the retry composition's deterministic 1 ms zero-jitter
# retry policy, both recorded routes with a context window so a route change
# can pass the model-switch compaction check, and free mode enabled over them.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max
    retryPolicy:
      mode: normal
      maxRetries: 2
      backoff:
        initialDelayMs: 1
        maxDelayMs: 1
        jitterRatio: 0
    models:
      - id: deepseek-v4-flash
        contextWindow: 1000000
      - id: deepseek-v4-pro
        contextWindow: 1000000

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: llm-free-mode
  name: '@deepseek-ai/dsh-llm-free-mode'
  config:
    enabled: true
    routes:
      - provider: deepseek-official
        model: deepseek-v4-flash
        freeTierConfirmed: true
      - provider: deepseek-official
        model: deepseek-v4-pro
        freeTierConfirmed: true
